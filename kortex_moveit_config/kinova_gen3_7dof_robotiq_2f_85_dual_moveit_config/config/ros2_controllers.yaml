controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    cpu_affinity: 2        # isolated core (isolcpus=2,3,6,7); ONE loop drives both arms
    lock_memory: true      # mlockall to avoid page-fault jitter
    thread_priority: 80    # SCHED_FIFO priority (under ulimit -r 98 ceiling)

    # Both arms are read/written by this single controller_manager, so each cycle
    # contains TWO blocking Refresh() round trips (~1.28 ms each). Against a
    # 1000 us period that overran every cycle and the periodic policy quantised
    # the real period to 3000 us -> a measured 337 Hz. Letting the hardware pace
    # the loop removes the quantisation.
    hardware_synchronization:
      expect_blocking_read_write: true
      minimum_cycle_time: 0.0001

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_twist_controller:
      type: picknik_twist_controller/PicknikTwistController
    right_twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    left_gripper_controller:
      type: position_controllers/GripperActionController
    right_gripper_controller:
      type: position_controllers/GripperActionController

    left_fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController
    right_fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - left_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
      - right_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_twist_controller:
  ros__parameters:
    joint: left_tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

right_twist_controller:
  ros__parameters:
    joint: right_tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

left_gripper_controller:
  ros__parameters:
    default: true
    joint: left_robotiq_85_left_knuckle_joint
    allow_stalling: true

right_gripper_controller:
  ros__parameters:
    default: true
    joint: right_robotiq_85_left_knuckle_joint
    allow_stalling: true

left_fault_controller:
  ros__parameters:
    prefix: left_

right_fault_controller:
  ros__parameters:
    prefix: right_
