      right_joint_7: {trajectory: 0.08, goal: 0.05}

left_twist_controller:
  ros__parameters:
    joint: left_tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

right_twist_controller:
  ros__parameters:
    joint: right_tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

left_gripper_controller:
  ros__parameters:
    default: true
    joint: left_robotiq_85_left_knuckle_joint
    allow_stalling: true

right_gripper_controller:
  ros__parameters:
    default: true
    joint: right_robotiq_85_left_knuckle_joint
    allow_stalling: true

left_fault_controller:
  ros__parameters:
    prefix: left_

right_fault_controller:
  ros__parameters:
    prefix: right_
