controller_manager:
  ros__parameters:
    update_rate: 2000  # Hz - trigger grid for the async hardware threads, see below
    cpu_affinity: 2        # isolated core (isolcpus=2,3,6,7); ONE loop drives both arms
    lock_memory: true      # mlockall to avoid page-fault jitter
    thread_priority: 80    # SCHED_FIFO priority (under ulimit -r 98 ceiling)

    # Both arms are driven by this single controller_manager. ResourceManager::write()
    # is a plain for-loop over components, so with synchronous hardware each cycle
    # contained TWO blocking Refresh() round trips back to back: measured write p50
    # 1969 us -> ~520 Hz, against 1278 us / 857 Hz for a single arm. The two round
    # trips are independent (different arms, different subnets) and were serialising
    # for no reason.
    #
    # Fix: both hardware components are declared is_async="true" in the URDF
    # (kortex_dual_robots.xacro -> kortex.ros2_control.xacro), each with its own
    # thread pinned to an isolated core (left=6, right=7, SCHED_FIFO 80). The two
    # Refresh() calls now overlap, so a cycle costs max(left, right) instead of
    # left + right.
    #
    # Because nothing in the loop blocks any more, expect_blocking_read_write MUST
    # be off here - it would spin the loop at the 100 us minimum_cycle_time floor.
    # The periodic policy is back, and update_rate is now the *trigger grid* for the
    # async threads: an async cycle taking t us starts again after ceil(t/period)*period.
    # At 2000 Hz (500 us grid) a ~1.3 ms round trip quantises to 1.5 ms -> ~667 Hz per
    # arm; raise to 3000-4000 for ~700-770 Hz at a few % more cpu2. Update costs ~25 us,
    # so 2000 Hz is ~5% of the isolated core.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_twist_controller:
      type: picknik_twist_controller/PicknikTwistController
    right_twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    left_gripper_controller:
      type: position_controllers/GripperActionController
    right_gripper_controller:
      type: position_controllers/GripperActionController

    left_fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController
    right_fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - left_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Execution tolerances. These were all 0.0, which in JointTrajectoryController
    # means NOT ENFORCED: the controller reported SUCCESS no matter where the arm
    # actually ended up, and never aborted if a joint fell behind mid-trajectory.
    # MoveIt therefore planned the next move from an assumed-correct state. With
    # two arms sharing a workspace that is how a tracking deviation turns into a
    # physical collision that nothing notices until the next planning request.
    #   trajectory: max deviation from the commanded path DURING motion -> abort
    #   goal:       max deviation from the final point -> goal rejected
    # Sized from MEASURED following error at the speed actually used. Re-measured
    # 2026-09-10 at velocity scaling 0.8, ~200k samples per arm over 105 s, with
    # rt-fix-userspace.sh applied: worst joint error 17.6 mrad, p99 15.5, and the
    # two arms agree to within 0.2 mrad. The worst joints are the wrist (5/6/7);
    # the shoulder pair stay under 7.
    #   trajectory 0.08 rad = ~4.5x the worst observed, the same headroom ratio
    #   the earlier 0.05 had against its own 11.4 mrad at velocity 0.5.
    # goal stays at 0.05: it governs final settling, not speed-dependent lag, so
    # raising it would only let a move finish short of the commanded pose.
    #
    # NOTE this tolerance is not what causes PATH_TOLERANCE_VIOLATED aborts on
    # this cell. Normal tracking uses about a third of the budget, so a violation
    # means something exceeded ~3x normal -- an EVENT, not lag. The two known
    # candidates are physical contact (the demo pose has only 10-15 mm of true
    # inter-arm clearance; see scripts/arm_padding.py) and a latency spike from
    # the Kortex transport threads sitting on E-cores when
    # rt-tune/rt-fix-userspace.sh has not been re-run since the last launch.
    # Loosening this further hides those rather than fixing them.
    # The previous 0.20 rad was useless for this: on joint_4 it permits 95 mm of
    # gripper-tip displacement, ten times the collision margin padding provides.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      left_joint_1: {trajectory: 0.08, goal: 0.05}
      left_joint_2: {trajectory: 0.08, goal: 0.05}
      left_joint_3: {trajectory: 0.08, goal: 0.05}
      left_joint_4: {trajectory: 0.08, goal: 0.05}
      left_joint_5: {trajectory: 0.08, goal: 0.05}
      left_joint_6: {trajectory: 0.08, goal: 0.05}
      left_joint_7: {trajectory: 0.08, goal: 0.05}

